[program:erpmax-go-services]
command=/home/dg/frappe-bench/apps/erpmax/go-services/erpmax-go-services
directory=/home/dg/frappe-bench/apps/erpmax/go-services
user=root
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/var/log/erpmax-go-services.log
stderr_logfile=/var/log/erpmax-go-services-error.log
environment=
    PORT="8080",
    DB_HOST="localhost",
    DB_PORT="3306",
    DB_USER="root",
    DB_PASSWORD="",
    DB_NAME="erpmax",
    REDIS_ADDR="localhost:6379",
    REDIS_PASSWORD="",
    REDIS_DB="0",
    WORKER_COUNT="10",
    BATCH_SIZE="1000",
    CACHE_TTL="3600"
