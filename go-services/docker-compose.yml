version: '3.8'

services:
  go-services:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_NAME=erpmax
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=0
      - WORKER_COUNT=10
      - BATCH_SIZE=1000
      - CACHE_TTL=3600
      - MAX_RETRIES=3
    depends_on:
      - mysql
      - redis
    networks:
      - erpmax-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-password}
      - MYSQL_DATABASE=erpmax
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - erpmax-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - erpmax-network
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:

networks:
  erpmax-network:
    driver: bridge
