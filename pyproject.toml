[project]
name = "erpmax"
authors = [
    { name = "Galaxy Labs", email = "galaxylab2020@gmail.com"}
]
description = "Enterprise Resource Planning Max"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.

    # Core Dependencies
    "qrcode>=7.0.0",
    "pyjwt>=2.0.0",
    "cryptography>=3.0.0",
    "lxml>=4.6.0",
    "requests>=2.25.0",
    "python-dateutil>=2.8.0",

    # ZATCA/FBR E-Invoicing
    "hijridate>=2.3.0",
    "pyqrcode>=1.2.1",
    "pypng>=0.20220414.0",
    "pyzbar>=0.1.9",

    # Reporting & PDF Generation
    "weasyprint>=60.0",
    "jinja2>=3.1.0",
    "weasyprint[full]>=60.0",

    # Data Processing
    "openpyxl>=3.1.0",
    "xlrd>=2.0.0",
    "pandas>=2.0.0",

    # Image Processing
    "Pillow>=10.0.0",
    "img2pdf>=0.4.0",

    # Barcode Support
    "python-barcode>=0.15.0",

    # Email & Communication
    "emails>=0.6.0",
    "jinja2-email>=0.1.0",

    # Financial Calculations
    "numpy>=1.24.0",

    # File Processing
    "chardet>=5.0.0",
    "pdfkit>=1.0.0",

    # Authentication & Security
    "bcrypt>=4.0.0",
    "passlib>=1.7.0",

    # API & Integration
    "flask>=3.0.0",
    "flask-cors>=4.0.0",

    # Utilities
    "pytz>=2023.3",
    "tzdata>=2023.3",
    "humanize>=4.0.0",
    "num2words>=0.5.0",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

# These apt dependencies will be installed from Ubuntu repositories when you host your app on Frappe Cloud
[deploy.dependencies.apt]
packages = [
    "libpango-1.0-0",
    "libpangoft2-1.0-0",
    "libharfbuzz-subset0",
    "libcairo2",
    "libgdk-pixbuf2.0-0",
    "libffi-dev",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
